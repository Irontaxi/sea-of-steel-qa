<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sea of Steel queue audit</title>
<style>body{font:17px system-ui;background:#142831;color:#eee3c6;max-width:1000px;margin:auto;padding:24px}h1{font-size:26px}article{padding:16px 0;border-bottom:1px solid #53636a}fieldset{border:0;padding:10px 0;display:flex;gap:22px;flex-wrap:wrap}input{width:20px;height:20px;vertical-align:middle}textarea{width:98%;background:#203a45;color:inherit;border:1px solid #74868e;padding:8px;font:inherit}button{font:inherit;padding:10px 18px;cursor:pointer}header{position:sticky;top:0;background:#142831;padding:12px 0}label{cursor:pointer}</style>
<h1>Sea of Steel queue audit</h1><p>Choose a status for each older entry. Your choices and notes save in this browser. Copy the results back to Producer when ready. Entries may include completed work.</p>
<header><button id="copy">Copy audit results</button> <span id="status" role="status"></span></header><main id="items"></main>
<script>
const rows=[["403","Tutorial progression and saved badges"],["408","Host icons, badges, sizing and panel layouts"],["418","AA escort scale and combat effectiveness"],["424","Airfield spacing"],["425","Reinforcement message space"],["426","Landing ship move markers"],["427","Duplicate Formation Spread controls"],["428","Convoy avoidance"],["429","Land and sea group persistence"],["430","Debug damage visualizer"],["431","Water mesh warning"],["432","Remove GROUP GUIDE text"],["433","Campaign and Tactical alignment"],["434","Tank turret smoothing"],["435","EOS connections and remaining session fixes"],["436","Shoreline recovery and peninsula navigation"],["437","Damaged carrier escort mission"],["438","Mine-clearance mission"],["439","Light-force convoy ambush"],["440","Submarine port ambush"],["441","Super battleship hunt"],["442","Prisoner rescue"],["443","Inland production targets"],["444","Coastal battery sight distance"],["445","Supply aircraft"],["446","DUKW land supply"],["447","Undeploy machine guns"],["448","Rotate machine guns"],["449","Infantry merge and save"],["450","Grenade location targeting and effects"],["451","P-38L and Ki-45 tuning, badges and propeller blur"],["452","Withdrawn branding refresh"],["453","Fog reveal coverage and edges"],["454","Remove UNIQUE column"],["455","Supply ship fuel capacities"],["456","Startup splash"],["457","Staggered AA audio"],["458","Fresh sorties from Aviation"],["459","Aircraft crash descent"],["460","Land movement circles"],["461","Airfield rebuild radius"],["462","NavalMovement stutter"],["463","Render stall"],["464","Freecam and pause follow-up"],["465","Debug time controls"],["466","Tides"],["467","Selected-unit ranges"],["468","Submarine depth toggle"]];
const key='sos-old-queue-audit-20261118';
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const root=document.getElementById('items');
function persist(){localStorage.setItem(key,JSON.stringify(saved))}
for(const [n,title] of rows){
 const a=document.createElement('article');const strong=document.createElement('strong');strong.textContent='Q'+n+' · '+title;a.append(strong);
 const f=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent='Audit decision';legend.hidden=true;f.append(legend);
 for(const choice of ['Done','Keep open','Drop']){const l=document.createElement('label');const i=document.createElement('input');i.type='radio';i.name='q'+n;i.value=choice;i.checked=saved[n]?.choice===choice;i.onchange=()=>{saved[n]={...saved[n],choice};persist()};l.append(i,' '+choice);f.append(l)}a.append(f);
 const note=document.createElement('textarea');note.rows=1;note.placeholder='Notes';note.setAttribute('aria-label','Notes for Q'+n);note.value=saved[n]?.note||'';note.oninput=()=>{saved[n]={...saved[n],note:note.value};persist()};a.append(note);root.append(a)
}
document.getElementById('copy').onclick=async()=>{const output=rows.map(([n,t])=>'Q'+n+' · '+(saved[n]?.choice||'Unreviewed')+' · '+t+(saved[n]?.note?' — '+saved[n].note:'')).join('\n');try{await navigator.clipboard.writeText(output);document.getElementById('status').textContent='Copied'}catch{const x=document.createElement('textarea');x.value=output;root.prepend(x);x.select();document.getElementById('status').textContent='Select and copy the results above'}};
</script></html>
